<div id="app"><header><div class="k">4교시 · 어니스톤 × neoNpeter</div><h1>심화과정 · 나만의 플랫폼 만들기</h1><p>기획부터 배포까지, 네오앤피터의 AX 프로세스와 함께.</p></header><div id="bar"><div class="now">지금 <em id="nowSec"></em></div><button id="tocBtn">전체 보기 / 한 쪽씩</button></div><div class="layout"><nav id="nav" aria-label="강의 목차"></nav><main><section class="pg" id="p0" data-t="01 · 왜 배포에서 막힐까"><h2><span class="n">01</span>왜 배포에서 막힐까요?</h2><div class="rule"></div><figure class="diagram"><figcaption>네오앤피터 AX 프로세스</figcaption><div class="flow-diagram"><div class="flow-node"><b>명세</b><small>무엇을 만들까</small></div><div class="flow-node"><b>구현</b><small>툴로 기능 만들기</small></div><div class="flow-node"><b>데이터</b><small>저장·연결·권한</small></div><div class="flow-node"><b>코칭·배포</b><small>검증하고 공개</small></div></div></figure></section><section class="pg" id="p1" data-t="02 · 기능명세서 작성"><h2><span class="n">02</span>아이디어 → 기능명세서</h2><div class="rule"></div><figure class="diagram"><figcaption>아이디어를 기능명세서로 바꾸기</figcaption><div class="flow-diagram"><div class="flow-node"><b>이용자</b><small>대상·상황</small></div><div class="flow-node"><b>화면과 기능</b><small>입력·버튼·결과</small></div><div class="flow-node"><b>데이터·권한</b><small>저장·접근 범위</small></div><div class="flow-node"><b>완료 기준</b><small>정상·오류 확인</small></div></div></figure><details><summary>기능명세서 실제 화면 보기</summary><a href="/lecture-screenshots/ax-functional-spec.png" target="_blank" rel="noopener"><img style="width:100%;height:auto;border:1px solid #e2e8f0;border-radius:12px" src="/lecture-screenshots/ax-functional-spec.png" alt="기능 목록과 화면별 기능 명세를 함께 정리하는 작업 화면" loading="lazy"></a></details></section><section class="pg" id="p2" data-t="03 · 바이브코딩 툴 활용"><h2><span class="n">03</span>요청 → 구현 → 확인 → 수정</h2><div class="rule"></div><figure class="diagram"><figcaption>작은 기능부터 확인하는 반복 과정</figcaption><div class="flow-diagram"><div class="flow-node"><b>요청</b><small>명세와 맥락 전달</small></div><div class="flow-node"><b>구현</b><small>한 기능씩 만들기</small></div><div class="flow-node"><b>확인</b><small>직접 동작 확인</small></div><div class="flow-node"><b>수정 ↺</b><small>오류 설명·재검증</small></div></div></figure></section><section class="pg" id="p3" data-t="04 · DB 구조화"><h2><span class="n">04</span>데이터가 연결되는 구조</h2><div class="rule"></div><figure class="diagram"><figcaption>교육 플랫폼의 DB 관계 예시</figcaption><div class="db-example"><div class="db-table"><b>회원</b><span>회원 ID</span><span>이름</span><span>역할</span></div><div class="db-relation">한 회원의<br>여러 신청 →</div><div class="db-table"><b>신청</b><span>신청 ID</span><span>회원 ID ↔</span><span>과정 ID ↔</span><span>진행 상태</span></div><div class="db-relation">← 한 과정에<br>여러 신청</div><div class="db-table"><b>과정·콘텐츠</b><span>과정 ID</span><span>제목</span><span>공개 여부</span></div></div><p class="diagram-note">설명을 위한 구조 예시입니다. 신청 기록이 회원과 과정을 ID로 연결합니다.</p></figure><figure class="diagram"><figcaption>데이터가 실제로 남는지 확인하기</figcaption><div class="flow-diagram"><div class="flow-node"><b>입력</b><small>신청 정보 작성</small></div><div class="flow-node"><b>저장</b><small>DB에 기록</small></div><div class="flow-node"><b>조회</b><small>새로 열어 확인</small></div><div class="flow-node"><b>수정</b><small>변경 내용 반영</small></div></div></figure></section><section class="pg" id="p4" data-t="05 · 맞춤형 코칭"><h2><span class="n">05</span>막힌 곳 → 다음 작업 → 배포</h2><div class="rule"></div><figure class="diagram"><figcaption>내 프로젝트에 맞춘 코칭 흐름</figcaption><div class="flow-diagram"><div class="flow-node"><b>현황 확인</b><small>목표와 막힌 곳</small></div><div class="flow-node"><b>다음 작업</b><small>핵심 기능·우선순위</small></div><div class="flow-node"><b>실행·검증</b><small>수정 결과 확인</small></div><div class="flow-node"><b>배포</b><small>설정·공개 후 점검</small></div></div></figure></section><section class="pg" id="p5" data-t="06 · 기획부터 배포까지"><h2><span class="n">06</span>기획부터 배포까지, 함께</h2><div class="rule"></div><figure class="diagram"><figcaption>기획부터 공개까지 이어지는 흐름</figcaption><div class="flow-diagram"><div class="flow-node"><b>기획·명세</b><small>이용자와 기능</small></div><div class="flow-node"><b>구현·DB</b><small>동작과 저장</small></div><div class="flow-node"><b>검증</b><small>권한·사용 흐름</small></div><div class="flow-node"><b>배포·운영</b><small>공개·점검·개선</small></div></div></figure><h3>심화과정에 가져올 것</h3><p><a class="ext" href="https://open.kakao.com/o/gDjov1Ni" target="_blank" rel="noopener">단톡방에서 심화과정 문의하기 ↗</a></p></section><div id="pager"><button id="prev">← 이전</button><span id="pageCount"></span><button id="next">다음 →</button></div></main></div><script>const pages=[...document.querySelectorAll('section.pg')];const nav=document.getElementById('nav');let cur=0;pages.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.dataset.t;b.onclick=()=>show(i);nav.appendChild(b)});function show(i,first=false){cur=Math.max(0,Math.min(pages.length-1,i));pages.forEach((p,j)=>p.classList.toggle('on',j===cur));[...nav.children].forEach((b,j)=>b.classList.toggle('cur',j===cur));document.getElementById('nowSec').textContent=pages[cur].dataset.t;document.getElementById('pageCount').textContent=(cur+1)+' / '+pages.length;document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===pages.length-1;if(!first)document.body.classList.add('present');window.scrollTo({top:0,behavior:'instant'})}document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);document.getElementById('tocBtn').onclick=()=>document.body.classList.toggle('allmode');document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON','IFRAME'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();show(cur+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(cur-1)}});show(0,true);</script></div></body></html>
